<!-- Product Catalog Header -->
<div class="flex flex-col lg:flex-row justify-between items-start lg:items-center mb-8">
  <div>
    <h1 class="text-3xl font-bold text-gray-900 mb-2">All Products</h1>
    <p class="text-gray-600">Discover our amazing collection of products</p>
  </div>
  
  <!-- Filters and Sort -->
  <div class="flex flex-col sm:flex-row gap-4 mt-4 lg:mt-0">
    <select class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
      <option>Sort by: Featured</option>
      <option>Price: Low to High</option>
      <option>Price: High to Low</option>
      <option>Newest First</option>
    </select>
    <button class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors duration-200">
      Filters
    </button>
  </div>
</div>

<!-- Product Grid -->
<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
  <div 
    *ngFor="let product of products" 
    class="bg-white rounded-lg shadow-md hover:shadow-xl transition-shadow duration-300 overflow-hidden group"
  >
    <!-- Product Image -->
    <div class="relative overflow-hidden bg-gray-100">
      <ng-container *ngIf="product.file_url; else alternativeImage">
        <img 
          src="{{ product.file_url }}" 
          alt="{{ product.name }}"
          class="w-full h-48 object-cover group-hover:scale-105 transition-transform duration-300"
        />
      </ng-container>
      <ng-template #alternativeImage>
        <div class="w-full h-48 flex items-center justify-center bg-gray-200">
          <svg class="w-12 h-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
          </svg>
        </div>
      </ng-template>
      
      <!-- Quick Actions Overlay -->
      <div class="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-20 transition-all duration-300 flex items-center justify-center opacity-0 group-hover:opacity-100">
        <button 
          (click)="viewProduct(product.id)"
          class="bg-white text-gray-900 px-4 py-2 rounded-lg mr-2 hover:bg-gray-100 transition-colors duration-200"
        >
          Quick View
        </button>
      </div>
    </div>

    <!-- Product Info -->
    <div class="p-4">
      <h3 class="text-lg font-semibold text-gray-900 mb-2 line-clamp-2">{{ product.name }}</h3>
      <p class="text-gray-600 text-sm mb-3 line-clamp-2">{{ product.description }}</p>
      
      <!-- Price -->
      <div class="flex items-center justify-between mb-4">
        <span class="text-2xl font-bold text-blue-600">₹{{ product.price }}</span>
        <div class="flex items-center text-yellow-400">
          <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20">
            <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
          </svg>
          <span class="text-sm text-gray-600 ml-1">4.5</span>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex gap-2">
        <button 
          (click)="viewProduct(product.id)"
          class="flex-1 px-4 py-2 border border-blue-600 text-blue-600 rounded-lg hover:bg-blue-50 transition-colors duration-200 text-sm font-medium"
        >
          View Details
        </button>
        <button 
          (click)="addToCart(product.id)"
          class="flex-1 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors duration-200 text-sm font-medium flex items-center justify-center"
        >
          <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4m0 0L7 13m0 0l-1.5 6.5M7 13v6a2 2 0 002 2h6a2 2 0 002-2v-6"></path>
          </svg>
          Add to Cart
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Empty State -->
<div *ngIf="!products || products.length === 0" class="text-center py-16">
  <svg class="w-16 h-16 text-gray-400 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2 2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path>
  </svg>
  <h3 class="text-lg font-medium text-gray-900 mb-2">No products found</h3>
  <p class="text-gray-600">Try adjusting your search or filter criteria.</p>
</div>
